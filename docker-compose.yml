name: bling

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bling
      POSTGRES_USER: bling
      POSTGRES_PASSWORD: bling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bling -d bling"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://bling:bling@postgres:5432/bling?sslmode=disable"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

