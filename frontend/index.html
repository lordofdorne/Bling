<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161716" />
    <title>Bling — Live calls for creators</title>
    <script>
      (function () {
        var theme = "dark";
        try {
          var pref = localStorage.getItem("bling-theme");
          if (pref === "light") theme = "light";
          else if (
            pref === "system" &&
            window.matchMedia("(prefers-color-scheme: light)").matches
          )
            theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        var width = window.innerWidth;
        var screen =
          width <= 720
            ? "phone"
            : width <= 980
              ? "tablet"
              : width <= 1180
                ? "laptop"
                : width <= 1699
                  ? "desktop"
                  : "wide";
        document.documentElement.setAttribute("data-screen", screen);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute(
            "content",
            theme === "light" ? "#f3f1eb" : "#161716",
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
