<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#161716" />
    <title>Bling — Talk live with creators</title>
    <meta
      name="description"
      content="Talk live with the creators you follow. Fans ask to call, creators pick who they talk to — one-on-one or on their livestream. No app to download."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Bling" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bling" />
    <meta property="og:title" content="Bling — Talk live with creators" />
    <meta
      property="og:description"
      content="Talk live with the creators you follow. Fans ask to call, creators pick who they talk to — one-on-one or on their livestream. No app to download."
    />
    <meta property="og:url" content="https://blinghotline.com" />
    <meta property="og:image" content="https://blinghotline.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Bling logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        var theme = "dark";
        try {
          var pref = localStorage.getItem("bling-theme");
          if (pref === "light") theme = "light";
          else if (
            pref === "system" &&
            window.matchMedia("(prefers-color-scheme: light)").matches
          )
            theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        var width = window.innerWidth;
        var screen =
          width <= 720
            ? "phone"
            : width <= 980
              ? "tablet"
              : width <= 1180
                ? "laptop"
                : width <= 1699
                  ? "desktop"
                  : "wide";
        document.documentElement.setAttribute("data-screen", screen);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute(
            "content",
            theme === "light" ? "#f3f1eb" : "#161716",
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
